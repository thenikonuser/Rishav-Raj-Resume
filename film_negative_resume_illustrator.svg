<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1697" width="1200" height="1697" style="background:#09090b; font-family:'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <!-- Film sprocket symbol -->
    <g id="sprocket-hole">
      <rect width="28" height="18" rx="4" ry="4" fill="#000000" stroke="#27272a" stroke-width="1.5"/>
    </g>
    <!-- Linear gradients -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- LAYER 1: BACKGROUND -->
  <g id="Layer_Background">
    <rect width="1200" height="1697" fill="#0c0c0e"/>
    <!-- Subtle film guide lines -->
    <line x1="80" y1="80" x2="1120" y2="80" stroke="#1f1f23" stroke-width="1"/>
    <line x1="80" y1="1617" x2="1120" y2="1617" stroke="#1f1f23" stroke-width="1"/>
  </g>

  <!-- LAYER 2: HEADER -->
  <g id="Layer_Header" transform="translate(80, 110)">
    <text x="0" y="0" font-family="'Cinzel', Georgia, serif" font-size="44" font-weight="900" fill="#fef3c7" letter-spacing="4">RISHAV RAJ</text>
    <text x="0" y="32" font-size="14" font-weight="700" fill="#f59e0b" letter-spacing="3" font-family="monospace">VISUAL STORYTELLER • FASHION &amp; EDITORIAL • CREATIVE DIRECTOR</text>
    <text x="0" y="58" font-size="12" fill="#71717a" letter-spacing="1.5" font-family="monospace">KODAK PORTRA 400 • 35MM CINEMATIC ARCHIVE • MUMBAI, INDIA</text>

    <!-- Header badges -->
    <rect x="740" y="-30" width="300" height="70" fill="#18181b" stroke="#27272a" rx="4"/>
    <text x="760" y="-6" font-size="11" font-family="monospace" fill="#a1a1aa">ACTIVE BASE</text>
    <text x="760" y="16" font-size="16" font-weight="700" fill="#fef3c7">MUMBAI, MAHARASHTRA</text>
    <text x="760" y="32" font-size="10" font-family="monospace" fill="#65a30d">AVAILABLE FOR HIGH-VALUE COMMISSIONS</text>
  </g>

  <!-- LAYER 3: 35MM FILM NEGATIVE HORIZONTAL STRIP -->
  <g id="Layer_Film_Strip" transform="translate(80, 230)">
    <!-- Strip background container -->
    <rect x="0" y="0" width="1040" height="380" fill="#000000" stroke="#27272a" stroke-width="2"/>

    <!-- TOP SPROCKETS -->
    <g transform="translate(20, 12)">
