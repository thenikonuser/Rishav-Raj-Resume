        <text x="45" y="46" font-family="monospace" font-size="8" fill="#a1a1aa" text-anchor="middle">TOTAL SHOOTS</text>

        <rect x="105" width="90" height="60" fill="#18181b" stroke="#27272a" rx="3"/>
        <text x="150" y="30" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#f59e0b" text-anchor="middle">8+</text>
        <text x="150" y="46" font-family="monospace" font-size="8" fill="#a1a1aa" text-anchor="middle">YRS EXPERIENCE</text>

        <rect x="210" width="100" height="60" fill="#18181b" stroke="#27272a" rx="3"/>
        <text x="260" y="30" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#f59e0b" text-anchor="middle">20+</text>
        <text x="260" y="46" font-family="monospace" font-size="8" fill="#a1a1aa" text-anchor="middle">WEDDINGS/YR</text>
