      <text x="0" y="244" font-size="11" fill="#d4d4d8">• Godox V1 Round-Head Flash</text>
      <text x="0" y="264" font-size="11" fill="#d4d4d8">• Godox SK400 II Studio Strobes</text>
      <text x="0" y="284" font-size="11" fill="#d4d4d8">• Godox SL60W Continuous Video Light</text>
      <text x="0" y="304" font-size="11" fill="#d4d4d8">• Octaboxes, Grids, Scrims &amp; Reflectors</text>

