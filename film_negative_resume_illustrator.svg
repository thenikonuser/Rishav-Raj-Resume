    <text x="40" y="66" font-size="12" fill="#a1a1aa">Available for Fashion Editorials, Luxury Weddings, Model Portfolios &amp; Commercial Projects across Mumbai &amp; Destinations.</text>
    
    <text x="40" y="98" font-family="monospace" font-size="11" fill="#f59e0b">PHONE: +91 98765 43210</text>
    <text x="320" y="98" font-family="monospace" font-size="11" fill="#f59e0b">EMAIL: rishavraj@gmail.com</text>
    <text x="600" y="98" font-family="monospace" font-size="11" fill="#f59e0b">PORTFOLIO: weclik.in</text>
    <text x="820" y="98" font-family="monospace" font-size="11" fill="#f59e0b">IG: @rishavrawvisuals</text>
