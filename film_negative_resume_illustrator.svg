      <text x="0" y="60" font-size="11" fill="#d4d4d8">• Adobe Lightroom Classic (Mastery)</text>
      <text x="0" y="78" font-size="11" fill="#d4d4d8">• Adobe Photoshop &amp; ACR (Mastery)</text>
      <text x="0" y="96" font-size="11" fill="#d4d4d8">• DaVinci Resolve Studio (Advanced Grading)</text>
      <text x="0" y="114" font-size="11" fill="#d4d4d8">• Adobe Premiere Pro (Video Reels)</text>
      <text x="0" y="132" font-size="11" fill="#d4d4d8">• Capture One Pro (Tethered Studio)</text>

