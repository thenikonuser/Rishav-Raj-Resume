      <use href="#sprocket-hole" x="65"/>
      <use href="#sprocket-hole" x="130"/>
      <use href="#sprocket-hole" x="195"/>
      <use href="#sprocket-hole" x="260"/>
      <use href="#sprocket-hole" x="325"/>
      <use href="#sprocket-hole" x="390"/>
      <use href="#sprocket-hole" x="455"/>
      <use href="#sprocket-hole" x="520"/>
      <use href="#sprocket-hole" x="585"/>
      <use href="#sprocket-hole" x="650"/>
      <use href="#sprocket-hole" x="715"/>
      <use href="#sprocket-hole" x="780"/>
      <use href="#sprocket-hole" x="845"/>
      <use href="#sprocket-hole" x="910"/>
      <use href="#sprocket-hole" x="975"/>
