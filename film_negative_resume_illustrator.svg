      <text x="0" y="170" font-size="11" fill="#d4d4d8">• NIKKOR Z 85mm f/1.8 S (Beauty Portraits)</text>
      <text x="0" y="190" font-size="11" fill="#d4d4d8">• NIKKOR Z 28–75mm f/2.8 (Runway Zoom)</text>

      <!-- Lighting & Modifiers -->
