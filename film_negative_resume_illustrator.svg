    <!-- FRAME 001 -->
    <g transform="translate(30, 48)">
      <rect width="220" height="280" fill="#121214" stroke="#f59e0b" stroke-width="1"/>
      <rect x="10" y="10" width="200" height="150" fill="#1c1917" stroke="#292524"/>
      <text x="110" y="90" font-family="monospace" font-size="11" fill="#78716c" text-anchor="middle">[ PHOTO 001 ]</text>
      <text x="14" y="185" font-family="monospace" font-size="10" fill="#f59e0b">FRAME 001 • OCT 2015</text>
      <text x="14" y="208" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#fef3c7">MEOW Studio</text>
      <text x="14" y="228" font-size="11" fill="#a1a1aa">Light Assistant</text>
      <text x="14" y="248" font-size="9" fill="#71717a">Lighting discipline, studio strobe setups, ACR raw conversion.</text>
    </g>

    <!-- FRAME 002 -->
    <g transform="translate(280, 48)">
      <rect width="220" height="280" fill="#121214" stroke="#3f3f46" stroke-width="1"/>
      <rect x="10" y="10" width="200" height="150" fill="#1c1917" stroke="#292524"/>
      <text x="110" y="90" font-family="monospace" font-size="11" fill="#78716c" text-anchor="middle">[ PHOTO 002 ]</text>
      <text x="14" y="185" font-family="monospace" font-size="10" fill="#f59e0b">FRAME 002 • JAN 2016</text>
      <text x="14" y="208" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#fef3c7">Weddings Lead</text>
      <text x="14" y="228" font-size="11" fill="#a1a1aa">Independent Shooter</text>
      <text x="14" y="248" font-size="9" fill="#71717a">Nikon D5500, portraiture bokeh, documentary wedding style.</text>
    </g>

    <!-- FRAME 003 -->
    <g transform="translate(530, 48)">
      <rect width="220" height="280" fill="#121214" stroke="#f59e0b" stroke-width="1.5"/>
      <rect x="10" y="10" width="200" height="150" fill="#1c1917" stroke="#292524"/>
      <text x="110" y="90" font-family="monospace" font-size="11" fill="#78716c" text-anchor="middle">[ PHOTO 003 ]</text>
      <text x="14" y="185" font-family="monospace" font-size="10" fill="#f59e0b">FRAME 003 • JUN 2017</text>
      <text x="14" y="208" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#fef3c7">WECLIK</text>
